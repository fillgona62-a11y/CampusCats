name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          assets=()
          [ -f downloads/CampusCats-Android.apk ] && assets+=(downloads/CampusCats-Android.apk)
          [ -f downloads/CampusCats-iOS-Xcode.zip ] && assets+=(downloads/CampusCats-iOS-Xcode.zip)
          gh release create "$TAG_NAME" "${assets[@]}" --generate-notes --title "CampusCats $TAG_NAME"
