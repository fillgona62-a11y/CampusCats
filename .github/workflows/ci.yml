name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        with_opencv: [false, true]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r server/requirements.txt
          if [ "${{ matrix.with_opencv }}" = "true" ]; then
            python -m pip install "opencv-python-headless>=4.11,<5"
          fi
      - name: Run unit test suite
        run: python -B -m unittest discover -s server -p "test_*.py" -v

  web-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check frontend JS syntax
        run: |
          for f in web/*.js; do
            if [ "$f" = "web/sw.js" ]; then
              node --check "$f"
            else
              node --input-type=module --check < "$f"
            fi
          done
