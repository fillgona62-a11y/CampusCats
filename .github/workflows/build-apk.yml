name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/android/**'
      - 'web/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build & Sign CampusCats-Android.apk
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)
          PLAT=$(ls -d "$ANDROID_HOME/platforms/android-"* | sort -V | tail -n 1)
          ANDROID_JAR="$PLAT/android.jar"
          echo "Using build-tools=$BT platform=$PLAT"

          WORK="$RUNNER_TEMP/apk-build"
          rm -rf "$WORK"
          mkdir -p "$WORK/classes" "$WORK/dex" "$WORK/res" "$WORK/assets" "$WORK/src"

          javac -encoding UTF-8 -Xlint:-options -source 8 -target 8 \
            -sourcepath "$WORK/src" -classpath "$ANDROID_JAR" \
            -d "$WORK/classes" mobile/android/src/campus/cats/*.java

          jar cf "$WORK/app.jar" -C "$WORK/classes" .
          "$BT/d8" --min-api 26 --lib "$ANDROID_JAR" --output "$WORK/dex" "$WORK/app.jar"

          cp -r mobile/android/res/* "$WORK/res/"
          python3 - << 'PY'
          import xml.etree.ElementTree as ET
          p = "$WORK/res/values/config.xml".replace("$WORK", __import__("os").environ["RUNNER_TEMP"] + "/apk-build")
          tree = ET.parse(p)
          for node in tree.findall(".//string[@name='campus_origin']"):
              node.text = "https://thickearth.online"
          tree.write(p, encoding="utf-8", xml_declaration=True)
          PY

          cp -r web/* "$WORK/assets/"
          cp mobile/android/android-files.js "$WORK/assets/"
          python3 - << 'PY'
          import os
          idx = os.environ["RUNNER_TEMP"] + "/apk-build/assets/index.html"
          s = open(idx, encoding="utf-8").read()
          s = s.replace("</head>", '<script type="module" src="/android-files.js"></script></head>', 1)
          open(idx, "w", encoding="utf-8").write(s)
          PY

          "$BT/aapt" package -f -M mobile/android/AndroidManifest.xml \
            -S "$WORK/res" -A "$WORK/assets" -I "$ANDROID_JAR" -F "$WORK/unsigned.apk"
          jar uf "$WORK/unsigned.apk" -C "$WORK/dex" classes.dex
          "$BT/zipalign" -f 4 "$WORK/unsigned.apk" "$WORK/aligned.apk"

          KEY="$WORK/campuscats-signing.jks"
          keytool -genkeypair -keystore "$KEY" -storetype JKS \
            -storepass android -keypass android -alias pilot \
            -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Campus Cats Release"

          mkdir -p dist
          "$BT/apksigner" sign --v4-signing-enabled false --ks "$KEY" \
            --ks-key-alias pilot --ks-pass pass:android --key-pass pass:android \
            --out dist/CampusCats-Android.apk "$WORK/aligned.apk"
          "$BT/apksigner" verify --verbose dist/CampusCats-Android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CampusCats-Android-APK
          path: dist/CampusCats-Android.apk
